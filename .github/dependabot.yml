version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # 랜딩 페이지 빌드 전용. 앱과 분리된 site/package.json만 대상.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Astro 검사기의 TypeScript 7 지원 전까지 메이저 업데이트 보류.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
