name: Site CI

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'script/site_*.sh'
      - 'Sources/OpenUsage/**'
      - '.github/workflows/site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'script/site_*.sh'
      - 'Sources/OpenUsage/**'
      - '.github/workflows/site.yml'

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # site/package.json의 @playwright/test 버전과 함께 갱신.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host --user 1001
    defaults:
      run:
        shell: bash
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run verify
      - name: Verify assembled output
        run: ../script/site_assemble.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-test-results
          path: |
            site/playwright-report/
            site/test-results/
          retention-days: 7
