# main의 가격표 변경을 GitHub Pages에 게시.
#
# 가격표에는 Cursor 모델 가격(auto, composer-*, github_bugbot), fast 배수, 모델 별칭 규칙 포함.
# 포크 피드를 읽는 앱의 가격표 갱신은 마지막 성공 후 한 시간 간격이며 태그·릴리스·Sparkle과 독립.
# upstream 피드를 읽던 기존 앱은 포크 피드로 전환하는 앱 업데이트 필요.
#
# Release·사이트 게시와 실행 그룹 공유. keep_files 게시를 직렬화하여 동시 push의 변경 유실 방지.
name: Publish pricing supplement

on:
  push:
    branches: [main]
    paths:
      - Sources/OpenUsage/Resources/pricing_supplement.json
      - .github/workflows/pricing-supplement.yml
  workflow_dispatch:

concurrency:
  group: release-appcast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 가격표 JSON 검증
        run: |
          python3 - << 'PY'
          import json, re, sys
          from datetime import datetime
          with open("Sources/OpenUsage/Resources/pricing_supplement.json") as f:
              supplement = json.load(f)
          problems = []
          updated_at = supplement.get("updated_at")
          if not isinstance(updated_at, str) or not re.fullmatch(
              r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z", updated_at
          ):
              problems.append("updated_at must use YYYY-MM-DDTHH:MM:SSZ UTC format")
          else:
              try:
                  datetime.strptime(updated_at, "%Y-%m-%dT%H:%M:%SZ")
              except ValueError:
                  problems.append("updated_at must be a valid UTC date and time")
          for model, entry in supplement["pricing"].items():
              for field in ("input_per_million", "output_per_million"):
                  if not isinstance(entry.get(field), (int, float)):
                      problems.append(f"pricing[{model}].{field} missing or not a number")
          for rule in supplement["alias_rules"]:
              try:
                  re.compile(rule["pattern"])
              except re.error as error:
                  problems.append(f"alias pattern {rule['pattern']!r}: {error}")
              if not rule.get("canonical"):
                  problems.append(f"alias pattern {rule['pattern']!r} has no canonical")
          for model, multiplier in (supplement.get("fast_multipliers") or {}).items():
              if not isinstance(multiplier, (int, float)) or multiplier <= 0:
                  problems.append(f"fast_multipliers[{model}] must be a positive number")
          if problems:
              sys.exit("Supplement validation failed:\n" + "\n".join(problems))
          print(f"Supplement OK: {len(supplement['pricing'])} models, "
                f"{len(supplement['alias_rules'])} alias rules.")
          PY

      - name: Pages 디렉터리 조립
        run: |
          mkdir -p public
          cp Sources/OpenUsage/Resources/pricing_supplement.json public/pricing_supplement.json

      - name: GitHub Pages에 가격표 게시
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: true
          # 사용자 지정 도메인에서 피드를 제공하므로 gh-pages에 CNAME 유지.
          cname: openusage.chanhyung.kim

      - name: 게시된 Pages 커밋 기록
        run: |
          git fetch --no-tags --depth=1 origin gh-pages
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/revision.txt"

      - name: 검증된 게시 커밋 전달
        uses: actions/upload-artifact@v7
        with:
          name: pages-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/revision.txt
          if-no-files-found: error
