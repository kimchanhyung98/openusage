name: Release

# 배포할 버전에 태그 지정: `git tag v0.10.0 && git push origin v0.10.0`.
# pre-release 접미사 태그(예: v0.10.0-beta.1)는 Early Access channel에 배포.
# 일반 태그(v0.10.0)는 전체 사용자에게 배포.
# 최초 secret·Pages 설정은 .agents/skills/release-swift/의 release-swift skill 참고.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.10.0)"
        required: true
        type: string

permissions:
  contents: write

# 릴리스 직렬화. 각 실행에서 gh-pages의 appcast.xml을 읽어 generate_appcast로 재생성 후 branch 강제 배포.
# 두 태그가 연이어 push될 때 race로 feed 항목이 누락되는 문제 방지.
concurrency:
  group: release-appcast
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          # 요청한 태그 빌드. 태그 push에서는 `inputs.tag`가 비어 있어 trigger 태그를 기본 checkout.
          # workflow_dispatch에서는 기본 branch 대신 입력 태그로 고정.
          ref: ${{ inputs.tag }}
          fetch-depth: 0          # CFBundleVersion인 commit 수 계산을 위한 전체 이력
          persist-credentials: true

      - name: Select Xcode
        # GitHub runner의 actool이 Liquid Glass `.icon`을 컴파일하지 못해 앱 아이콘은 사전 빌드 후 commit
        # (Apple regression FB20183399, script/compile_icon.sh 참고).
        # 빌드·서명·공증 단계에는 runner 기본 Xcode 사용 가능.
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve tag, version, and channel
        id: meta
        # 위 checkout이 트리를 `inputs.tag`로 고정하므로 태그 pattern을 script/version.sh에서 source하지 않고
        # inline으로 유지. script 추가 전 태그를 workflow_dispatch로 재빌드해도 source 실패 없음.
        # script/version.sh의 pattern과 동기화 필요.
        env:
          # dispatch 입력이 shell로 해석되지 않도록 script에 직접 보간하지 않고 환경 변수로 전달.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          [ -z "$TAG" ] && TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v(0\.([7-9]|[1-9][0-9]+)|[1-9][0-9]*\.(0|[1-9][0-9]*))\.(0|[1-9][0-9]*)(-beta\.[1-9][0-9]*)?$ ]]; then
            echo "Release tag must be v0.7.0 or newer, optionally ending in -beta.N, without leading zeroes: $TAG" >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          [ "$(git rev-parse --verify HEAD)" = "$TAG_COMMIT" ] \
            || { echo "Release tag does not point to HEAD: $TAG" >&2; exit 1; }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main \
            || { echo "Release tag must point to a commit reachable from origin/main: $TAG" >&2; exit 1; }
          VERSION="${TAG#v}"
          if [[ "$TAG" == *-* ]]; then CHANNEL=beta; PRERELEASE=true; else CHANNEL=stable; PRERELEASE=false; fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      # Developer ID 인증서를 임시 keychain으로 가져오고 검색 목록에 추가(post 단계에서 자동 정리).
      # 수동 `security create-keychain`/`import` block 대체.
      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          # 앱과 DMG 서명용 Developer ID Application 인증서(.p12, base64).
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Resolve signing identity
        run: |
          # 검색 목록에 추가된 인증서에서 codesign에 필요한 ID 표시 이름 확인.
          IDENTITY="$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "No Developer ID Application identity found in the imported cert" >&2; exit 1; }
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Write Sparkle private key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_private_key"
          echo "SPARKLE_PRIVATE_KEY_FILE=$RUNNER_TEMP/sparkle_ed_private_key" >> "$GITHUB_ENV"

      - name: Write iCloud provisioning profile
        env:
          ICLOUD_PROFILE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_ICLOUD_PROFILE }}
        run: |
          printf '%s' "$ICLOUD_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/openusage-icloud.provisionprofile"
          echo "ICLOUD_PROVISIONING_PROFILE=$RUNNER_TEMP/openusage-icloud.provisionprofile" >> "$GITHUB_ENV"

      - name: Carry forward the existing appcast
        run: |
          # generate_appcast는 디렉터리의 기존 appcast.xml과 새 DMG를 읽어 병합 appcast 작성.
          # feed/에 운영 appcast를 먼저 넣어 이전 버전과 다른 channel 항목 보존.
          # 디렉터리에 archive가 없는 항목의 기존 enclosure URL 유지 확인됨.
          mkdir -p feed
          # 미배포 상태(fresh feed)와 일시적 읽기 실패 구분.
          # 이어받을 appcast가 실제로 없을 때만 새 feed 시작.
          # network 오류가 운영 feed 전체 이력을 단일 항목으로 교체하지 않도록 그 외에는 중단.
          set +e
          git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            git fetch origin gh-pages
            # pricing-supplement.yml도 같은 branch에 배포하므로 appcast 없이 gh-pages만 존재 가능.
            # 최초 릴리스에서 appcast.xml 부재는 정상이며, 파일이 존재하지만 읽을 수 없으면 중단.
            if git cat-file -e origin/gh-pages:appcast.xml 2>/dev/null; then
              git show origin/gh-pages:appcast.xml > feed/appcast.xml \
                || { echo "gh-pages has appcast.xml but it could not be read — aborting to protect the feed." >&2; exit 1; }
              echo "Loaded existing appcast from gh-pages."
            else
              echo "gh-pages exists but carries no appcast.xml yet — starting a fresh feed."
            fi
          elif [ "$rc" -eq 2 ]; then
            echo "No gh-pages branch yet — starting a fresh feed."
          else
            echo "Could not reach origin to check for gh-pages — aborting to protect the feed." >&2
            exit 1
          fi

      - name: Build, sign, and notarize the DMG
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          # notarytool용 Apple ID, 앱 전용 비밀번호, team ID.
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OPENUSAGE_TAG: ${{ steps.meta.outputs.tag }}
          # OPENUSAGE_TAG 도입 전 태그를 workflow_dispatch로 재빌드할 때 당시 release.sh 요구 사항을
          # 충족하도록 유도한 버전도 전달. 현재 release.sh에서는 무시.
          OPENUSAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: ./script/release.sh

      # PostHog crash report symbolication을 위해 release.sh가 생성한 dSYM 업로드.
      # 앱 crash 자동 수집은 익명이며 Share-Anonymous-Usage opt-out 준수(docs/privacy.md 참고).
      # posthog-cli는 CI 전용 npm build tool로 앱 bundle에 포함되지 않음.
      # fork 등에서 POSTHOG_CLI_API_KEY가 없으면 명확한 경고 후 생략해 릴리스를 차단하지 않음.
      # key가 있으면 업로드 실패 시 단계를 실패시켜 symbol 없는 배포 방지.
      - name: Upload dSYMs to PostHog
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          # 앱의 TelemetryConfig.host와 일치하는 US region.
          POSTHOG_CLI_HOST: https://us.i.posthog.com
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ -z "${POSTHOG_CLI_API_KEY}" ]; then
            echo "::warning::POSTHOG_CLI_API_KEY not set — skipping dSYM upload; crashes for $VERSION will NOT symbolicate."
            exit 0
          fi
          [ -d dist/dSYMs ] || { echo "dist/dSYMs missing — release.sh did not produce a dSYM." >&2; exit 1; }
          npm install -g @posthog/cli
          # symbolication은 dSYM의 binary Mach-O UUID로 crash report와 symbol을 연결.
          # 릴리스별 flag 동기화 없이 `--directory`만 필요.
          posthog-cli dsym upload --directory dist/dSYMs

      - name: Publish DMG to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: OpenUsage ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: dist/OpenUsage-${{ steps.meta.outputs.version }}.dmg
          generate_release_notes: true

      - name: Generate appcast with Sparkle
        env:
          DMG: OpenUsage-${{ steps.meta.outputs.version }}.dmg
          CHANNEL: ${{ steps.meta.outputs.channel }}
          # 태그별 GitHub Release asset base URL.
          # generate_appcast는 feed/의 새 DMG에만 prefix를 적용하고 기존 항목은 이전 태그 URL 유지.
          DOWNLOAD_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/
        run: |
          # release.sh가 이미 받은 Sparkle SwiftPM artifact에서 generate_appcast 탐색.
          GA="$(find .build/artifacts -type f -name generate_appcast 2>/dev/null | head -n1)"
          [ -x "$GA" ] || { echo "generate_appcast not found under .build/artifacts" >&2; exit 1; }

          # 항목 누락 검증을 위한 기존 feed 항목 수. 최초 릴리스는 0.
          # Sparkle은 일반적으로 branch별 소수 버전만 유지하지만 이 feed는 이전 설치와 다른 channel 항목을
          # 계속 제공하도록 의도적으로 append-only 구성.
          before=0
          [ -f feed/appcast.xml ] && before=$(grep -c "<item>" feed/appcast.xml || true)

          cp "dist/$DMG" "feed/$DMG"

          # pre-release 태그는 Early Access(beta) channel, 일반 태그는 전체 사용자에게 배포.
          channel_arg=()
          [ "$CHANNEL" = "beta" ] && channel_arg=(--channel beta)

          # key 파일은 '/'를 포함할 수 있는 base64이므로 argv/glob으로 해석되지 않게 stdin으로 전달.
          cat "$SPARKLE_PRIVATE_KEY_FILE" | "$GA" \
            --ed-key-file - \
            --download-url-prefix "$DOWNLOAD_PREFIX" \
            --maximum-versions 0 \
            "${channel_arg[@]}" \
            feed

          # 병합 오류를 명확히 실패 처리. 새 DMG enclosure가 존재하고 같은 줄에 EdDSA 서명을 포함해야 함.
          # SUPublicEDKey와 서명 key가 다르면 generate_appcast가 서명을 조용히 생략.
          # 기존 항목이나 다른 channel 항목 누락 방지를 위해 전체 항목 수도 감소하면 안 됨.
          after=$(grep -c "<item>" feed/appcast.xml || true)
          grep -Eq "$DMG\"[^>]*sparkle:edSignature" feed/appcast.xml \
            || { echo "New item for $DMG is missing or unsigned (SUPublicEDKey/private-key mismatch?)." >&2; exit 1; }
          [ "$after" -ge "$before" ] || { echo "Appcast item count dropped ($before -> $after) — aborting." >&2; exit 1; }
          echo "Appcast OK: $before -> $after items."

      - name: Assemble Pages directory
        run: |
          mkdir -p public
          cp feed/appcast.xml public/appcast.xml

      - name: Publish appcast to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          # gh-pages는 pricing_supplement.json도 제공(pricing-supplement.yml 참고).
          # keep_files가 없으면 appcast 배포 시 해당 파일이 branch에서 삭제됨.
          keep_files: true
          # custom domain에서 feed를 제공하므로 gh-pages에 CNAME 유지.
          cname: openusage.chanhyung.kim
