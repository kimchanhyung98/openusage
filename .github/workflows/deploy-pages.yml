# gh-pages의 랜딩 페이지·appcast.xml·pricing_supplement.json을 Pages로 배포.
#
# 2026년 7월 기존 브랜치 배포의 서버 오류·대기 상태 고착으로 최신 appcast가 반영되지 않아
# 저장소의 Pages 소스를 GitHub Actions로 전환. 이 워크플로우에서 배포 처리.
#
# 세 게시 워크플로우의 GITHUB_TOKEN push는 후속 push 워크플로우를 실행하지 않으므로 workflow_run 사용.
# workflow_run과 수동 실행을 위해 이 파일을 기본 브랜치에 유지.
name: Deploy Pages

on:
  workflow_run:
    workflows: ["Release", "Publish pricing supplement", "Publish landing page"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    # 게시와 사후 검증까지 성공한 실행만 자동 배포.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 배포할 게시 커밋 선택
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "PAGES_REF=gh-pages" >> "$GITHUB_ENV"
          else
            gh run download "$PUBLISH_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "pages-publication-$PUBLISH_RUN_ATTEMPT" --dir "$RUNNER_TEMP/pages-publication"
            ref="$(cat "$RUNNER_TEMP/pages-publication/revision.txt")"
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Invalid published Pages commit."
              exit 1
            fi
            echo "PAGES_REF=$ref" >> "$GITHUB_ENV"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_RUN_ID: ${{ github.event.workflow_run.id }}
          PUBLISH_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PAGES_REF }}
          fetch-depth: 0

      - name: 과거 Pages 배포 차단
        run: |
          selected="$(git rev-parse HEAD)"
          checkpoint_ref=refs/heads/pages-deployment
          if git ls-remote --exit-code origin "$checkpoint_ref" > "$RUNNER_TEMP/pages-checkpoint"; then
            git fetch --no-tags origin "$checkpoint_ref"
            checkpoint="$(git rev-parse FETCH_HEAD)"
            if git merge-base --is-ancestor "$selected" "$checkpoint" && [ "$selected" != "$checkpoint" ]; then
              echo "Skipping superseded Pages revision $selected."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! git merge-base --is-ancestor "$checkpoint" "$selected"; then
              echo "::error::Pages revision is not a descendant of the deployment checkpoint."
              exit 1
            fi
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Could not read the Pages deployment checkpoint."
              exit "$status"
            fi
            # 첫 보호 배포는 현재 게시 head로만 초기화. 과거 실행 재시도로 보호 기준 생성 금지.
            git fetch --no-tags origin gh-pages
            if [ "$selected" != "$(git rev-parse FETCH_HEAD)" ]; then
              echo "::error::Initialize Pages deployment protection from the latest successful publication."
              exit 1
            fi
          fi
          # 배포 시도 전에 기준 전진. 이후 실패해도 같은 SHA 재시도는 허용하고 이전 SHA는 차단.
          git push origin "$selected:$checkpoint_ref"
          echo "deploy=true" >> "$GITHUB_OUTPUT"
        id: revision

      - name: 사이트 배포 산출물 업로드
        if: steps.revision.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: GitHub Pages 배포
        if: steps.revision.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
