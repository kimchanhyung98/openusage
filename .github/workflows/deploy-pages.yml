# gh-pages의 랜딩 페이지·appcast.xml·pricing_supplement.json을 Pages로 배포.
#
# 2026년 7월 기존 브랜치 배포의 서버 오류·대기 상태 고착으로 최신 appcast가 반영되지 않아
# 저장소의 Pages 소스를 GitHub Actions로 전환. 이 워크플로우에서 배포 처리.
#
# 세 게시 워크플로우의 GITHUB_TOKEN push는 후속 push 워크플로우를 실행하지 않으므로 workflow_run 사용.
# workflow_run과 수동 실행을 위해 이 파일을 기본 브랜치에 유지.
name: Deploy Pages

on:
  workflow_run:
    workflows: ["Release", "Publish pricing supplement", "Publish landing page"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # 게시와 사후 검증까지 성공한 실행만 자동 배포.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: 사이트 배포 산출물 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
